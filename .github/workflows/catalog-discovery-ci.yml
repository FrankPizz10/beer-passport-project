name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/catalog-discovery/**"
      - "db/**"
      - ".github/workflows/catalog-discovery-ci.yml"
  push:
    branches: [main]
    paths:
      - "experiments/catalog-discovery/**"
      - "db/**"
      - ".github/workflows/catalog-discovery-ci.yml"
  workflow_dispatch:

jobs:
  catalog-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: experiments/catalog-discovery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        working-directory: experiments/catalog-discovery
        run: ruff check .
      - name: Typecheck
        working-directory: experiments/catalog-discovery
        run: mypy .
      - name: Byte-compile
        working-directory: experiments/catalog-discovery
        run: python -m compileall -q src tests
      - name: Unit tests
        working-directory: experiments/catalog-discovery
        run: python -m unittest discover -s tests

  db-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tool
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check db/src db/tests
      - name: Byte-compile
        run: python -m compileall -q db/src db/tests
      - name: Unit tests
        working-directory: db
        run: python -m unittest discover -s tests